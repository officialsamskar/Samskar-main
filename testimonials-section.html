<!-- Samskar: "What families say". Paste this whole block into the main website's index.html, just above the
     "Where we celebrate with you" section. It stays hidden until there is at least one testimonial, and shows them
     one after another. The testimonials come from the Samskar admin app, so nothing here needs editing later. -->
<section class="sm-testi" id="testimonials" aria-labelledby="sm-testi-title" hidden>
  <style>
    .sm-testi{padding:4rem 1.25rem;text-align:center}
    .sm-testi .sm-inner{max-width:720px;margin:0 auto}
    .sm-testi h2{margin:0 0 .4rem}
    .sm-testi .sm-sub{margin:0 0 2rem;opacity:.75}
    .sm-testi .sm-slides{position:relative;min-height:9rem}
    .sm-testi figure{display:none;margin:0}
    .sm-testi figure.on{display:block;animation:smfade .6s ease}
    .sm-testi blockquote{margin:0;font-size:1.2rem;line-height:1.7}
    .sm-testi blockquote::before{content:"\201C";display:block;font-size:3rem;line-height:1;color:#C88D17}
    .sm-testi figcaption{margin-top:1rem;font-weight:600;color:#6E1F2B}
    .sm-testi .sm-date{display:block;margin-top:.2rem;font-weight:400;font-size:.9rem;color:inherit;opacity:.75}
    .sm-testi .sm-dots{display:flex;gap:.5rem;justify-content:center;margin-top:1.5rem}
    .sm-testi .sm-dots button{width:10px;height:10px;padding:0;border:0;border-radius:50%;background:rgba(110,31,43,.25);cursor:pointer}
    .sm-testi .sm-dots button[aria-current="true"]{background:#6E1F2B}
    .sm-testi .sm-more{margin:1.6rem 0 0;font-size:.95rem}
    .sm-testi .sm-more a{color:#6E1F2B;font-weight:600}
    .sm-testi button:focus-visible{outline:3px solid #C88D17;outline-offset:2px}
    @keyframes smfade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.sm-testi figure.on{animation:none}}
  </style>
  <div class="sm-inner">
    <h2 id="sm-testi-title">What families say</h2>
    <p class="sm-sub">Kind words from celebrations we've been part of.</p>
    <div class="sm-slides" aria-live="polite"></div>
    <div class="sm-dots"></div>
    <p class="sm-more"><a href="/testimonials.html">Read all testimonials</a> &nbsp;·&nbsp; <a href="https://samskar-adminpage.vercel.app/share/">Share your experience</a></p>
  </div>
  <script>
  (function () {
    var URL_ = 'https://samskar-adminpage.vercel.app/testimonials/data.json';
    var section = document.currentScript.parentNode;
    var slidesBox = section.querySelector('.sm-slides'), dotsBox = section.querySelector('.sm-dots');
    var slides = [], dots = [], i = 0, timer = null;

    function show(n) {
      slides[i].classList.remove('on'); dots[i].removeAttribute('aria-current');
      i = (n + slides.length) % slides.length;
      slides[i].classList.add('on'); dots[i].setAttribute('aria-current', 'true');
    }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function start() { stop(); if (slides.length > 1) timer = setInterval(function () { show(i + 1); }, 6000); }

    function build(items) {
      items.slice(0, 12).forEach(function (t, n) {
        var fig = document.createElement('figure'), q = document.createElement('blockquote'), c = document.createElement('figcaption');
        q.textContent = t.quote; c.textContent = t.author;            // textContent: never inserted as HTML
        if (t.event_day) {                                           // e.g. "Sunday, 12 October 2025"
          var dt = document.createElement('span'); dt.className = 'sm-date'; dt.textContent = t.event_day; c.appendChild(dt);
        }
        fig.appendChild(q); fig.appendChild(c); if (n === 0) fig.className = 'on';
        slidesBox.appendChild(fig); slides.push(fig);
        if (items.length > 1) {
          var d = document.createElement('button'); d.type = 'button';
          d.setAttribute('aria-label', 'Show testimonial ' + (n + 1)); if (n === 0) d.setAttribute('aria-current', 'true');
          d.addEventListener('click', function () { show(n); start(); });
          dotsBox.appendChild(d); dots.push(d);
        }
      });
      if (!slides.length) return;
      if (slides.length === 1) dots = [document.createElement('span')];  // keeps show() safe with a single slide
      section.hidden = false;
      section.addEventListener('mouseenter', stop); section.addEventListener('mouseleave', start);
      section.addEventListener('focusin', stop); section.addEventListener('focusout', start);
      start();
    }

    var ctrl = window.AbortController ? new AbortController() : null;
    var guard = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    fetch(URL_, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) { return r.ok ? r.json() : { testimonials: [] }; })
      .then(function (data) { clearTimeout(guard); if (data && Array.isArray(data.testimonials)) build(data.testimonials); })
      .catch(function () { /* if the admin app is unreachable, the section simply stays hidden */ });
  })();
  </script>
</section>
