{% if testimonials %}
<section class="quotes" data-quotes aria-label="What customers say">
  <style>
    .quotes{text-align:center;padding:.5rem 0}
    .quotes .slides{position:relative}
    .quotes figure{display:none;margin:0;padding:0 .5rem}
    .quotes figure.on{display:block;animation:qfade .5s ease}
    .quotes blockquote{margin:0;font-size:1.05rem;line-height:1.6;color:var(--ink,#2a2220)}
    .quotes blockquote::before{content:"\201C";display:block;font-size:2.4rem;line-height:1;color:var(--accent,#c88d17)}
    .quotes figcaption{margin-top:.6rem;font-size:.9rem;color:var(--muted,#7a6f66)}
    .quotes .qdate{display:block;margin-top:.1rem;font-size:.8rem}
    .quotes .dots{display:flex;gap:.45rem;justify-content:center;margin-top:.9rem}
    .quotes .dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line,#e8dfcc);cursor:pointer}
    .quotes .dots button[aria-current="true"]{background:var(--brand,#730707)}
    @keyframes qfade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){.quotes figure.on{animation:none}}
  </style>
  <div class="slides" aria-live="polite">
    {% for t in testimonials %}
    <figure class="{% if forloop.first %}on{% endif %}">
      <blockquote>{{ t.quote }}</blockquote>
      <figcaption>{{ t.author }}{% if t.event_date %}<span class="qdate">{{ t.event_date|date:"l, j F Y" }}</span>{% endif %}</figcaption>
    </figure>
    {% endfor %}
  </div>
  {% if testimonials|length > 1 %}
  <div class="dots">
    {% for t in testimonials %}<button type="button" aria-label="Show testimonial {{ forloop.counter }}" {% if forloop.first %}aria-current="true"{% endif %}></button>{% endfor %}
  </div>
  <script>
  (function () {   // shows one testimonial after another; pauses while hovered or focused
    var box = document.currentScript.closest('[data-quotes]');
    var slides = box.querySelectorAll('figure'), dots = box.querySelectorAll('.dots button'), i = 0, timer;
    function show(n) {
      slides[i].classList.remove('on'); dots[i].removeAttribute('aria-current');
      i = (n + slides.length) % slides.length;
      slides[i].classList.add('on'); dots[i].setAttribute('aria-current', 'true');
    }
    function start() { stop(); timer = setInterval(function () { show(i + 1); }, 6000); }
    function stop() { if (timer) clearInterval(timer); }
    for (var d = 0; d < dots.length; d++) (function (n) { dots[n].addEventListener('click', function () { show(n); start(); }); })(d);
    box.addEventListener('mouseenter', stop); box.addEventListener('mouseleave', start);
    box.addEventListener('focusin', stop); box.addEventListener('focusout', start);
    start();
  })();
  </script>
  {% endif %}
</section>
{% endif %}
