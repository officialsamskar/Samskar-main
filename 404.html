<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — Samskar</title>
<meta name="theme-color" content="#6E1F2B">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{--maroon:#6E1F2B;--maroon-deep:#4A141C;--gold:#C79A3C;--cream:#FBF3E6}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
    background:var(--cream);color:var(--maroon-deep);font-family:Georgia,"Times New Roman",serif}
  main{max-width:440px}
  img{width:120px;height:120px;border-radius:50%;object-fit:cover}
  h1{margin:20px 0 8px;font-size:2rem;color:var(--maroon)}
  p{margin:0 0 24px;line-height:1.6;font-family:system-ui,sans-serif}
  a{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--gold);color:#fff;
    text-decoration:none;font-family:system-ui,sans-serif;font-weight:600}
  a:focus-visible{outline:3px solid var(--maroon);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="Samskar emblem">
  <h1>This page wandered off</h1>
  <p>The page you were looking for doesn&rsquo;t exist, but the celebration is still on.</p>
  <a href="/">Back to Samskar</a>
</main>
</body>
</html>
